name: Setup Expo Assets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  create-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate Placeholder Assets
        run: |
          mkdir -p assets
          
          # Generate icon.png (1024x1024)
          convert -size 1024x1024 xc:navy -fill white -gravity center -pointsize 120 -draw "text 0,0 'APP'" assets/icon.png
          
          # Generate splash.png (1242x2436)
          convert -size 1242x2436 xc:navy -fill white -gravity center -pointsize 150 -draw "text 0,0 'SPLASH'" assets/splash.png
          
          # Generate adaptive-icon.png (1024x1024)
          convert -size 1024x1024 xc:navy -fill white -gravity center -pointsize 120 -draw "text 0,0 'ICON'" assets/adaptive-icon.png

      - name: Commit Assets to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: auto-generate missing placeholder Expo assets"
          file_pattern: "assets/*.png"
